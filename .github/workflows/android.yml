name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Supabase settings (lengths only, never values)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning::$name is empty: the APK will only work in pretend mode"
            else
              echo "$name is set (${#value} characters)"
            fi
          done

      - name: Lint, unit tests and debug build
        # Public Supabase settings for real login in the test APK (repository secrets; the
        # anon key is the public client key). Empty when unset: the APK then only works in
        # pretend mode.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/**/build/reports/
            app/**/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
